<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Pish Pish symbol">
  <!--
    The Pull  abstract convergence mark
    Hidden reference: paired inward-scoop arcs echo the beckoning "pish pish" gesture
    without depicting any figure. Outer nodes = people; center = shared experience.
  -->
  <g id="convergence-mark">
    <!-- Beckoning arc 1 (upper-left sweep inward) -->
    <path
      d="M 18 22 C 18 42, 32 48, 50 50"
      stroke="#0D0D0D"
      stroke-width="5.5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Beckoning arc 2 (upper-right sweep inward) -->
    <path
      d="M 82 22 C 82 42, 68 48, 50 50"
      stroke="#0D0D0D"
      stroke-width="5.5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Beckoning arc 3 (lower sweep upward) -->
    <path
      d="M 22 78 C 36 62, 44 54, 50 50"
      stroke="#0D0D0D"
      stroke-width="5.5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Beckoning arc 4 (lower-right counterbalance) -->
    <path
      d="M 78 78 C 64 62, 56 54, 50 50"
      stroke="#0D0D0D"
      stroke-width="5.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Outer nodes  entities drawn toward the center -->
    <circle cx="18" cy="22" r="6.5" fill="#0D0D0D"/>
    <circle cx="82" cy="22" r="6.5" fill="#0D0D0D"/>
    <circle cx="22" cy="78" r="6.5" fill="#0D0D0D"/>
    <circle cx="78" cy="78" r="6.5" fill="#0D0D0D"/>

    <!-- Focal point  the experience everyone gathers around -->
    <circle cx="50" cy="50" r="9" fill="#6B21FF"/>
    <!-- Inner highlight ring (negative-space depth) -->
    <circle cx="50" cy="50" r="13" stroke="#6B21FF" stroke-width="2" fill="none" opacity="0.35"/>
  </g>
</svg>
