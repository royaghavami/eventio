<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Pish Pish symbol">
  <!--
    The Pull — optimized hybrid mark
    Base: 4 curved purple arc segments orbiting a black focal point (shared energy / experience)
    Enhancement: tapered pull lines + asymmetric outer anchors (circle · square · circle · arc)
    Narrative: Attraction → People → Connection → Gathering
  -->
  <defs>
    <style>
      .arc { stroke: #6B21FF; stroke-width: 10.5; stroke-linecap: round; fill: none; }
      .pull { stroke: #0D0D0D; stroke-linecap: round; fill: none; }
      .core { fill: #0D0D0D; }
    </style>
  </defs>

  <!-- Four inward-curving purple segments — gathering vortex -->
  <circle class="arc" cx="50" cy="50" r="31" stroke-dasharray="36 12.7" transform="rotate(18 50 50)"/>

  <!-- Tapered pull lines — magnetic attraction between nodes and center -->
  <path class="pull" stroke-width="1.1" d="M 24 26 Q 42 40 50 50"/>
  <path class="pull" stroke-width="1.8" d="M 42 40 50 50"/>
  <path class="pull" stroke-width="1.1" d="M 76 26 Q 58 40 50 50"/>
  <path class="pull" stroke-width="1.8" d="M 58 40 50 50"/>
  <path class="pull" stroke-width="1.1" d="M 76 74 Q 58 60 50 50"/>
  <path class="pull" stroke-width="1.8" d="M 58 60 50 50"/>
  <path class="pull" stroke-width="1.1" d="M 24 74 Q 42 60 50 50"/>
  <path class="pull" stroke-width="1.8" d="M 42 60 50 50"/>

  <!-- Outer anchors — four people / points of discovery (asymmetric for memorability) -->
  <circle fill="#6B21FF" cx="22" cy="24" r="5.5"/>
  <rect fill="#6B21FF" x="66" y="17" width="14" height="14" rx="4"/>
  <circle fill="#6B21FF" cx="78" cy="76" r="5.5"/>
  <path stroke="#6B21FF" stroke-width="8" stroke-linecap="round" fill="none" d="M 12 74 A 14 14 0 0 1 30 88"/>

  <!-- Focal point — the experience everyone converges on -->
  <circle class="core" cx="50" cy="50" r="6.5"/>
</svg>
