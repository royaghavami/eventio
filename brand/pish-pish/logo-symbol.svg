<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Pish Pish symbol">
  <!--
    The Pull — convergence mark
    Five outer nodes + inward-scoop arcs abstract the beckoning "pish pish" gesture.
    Constructed on a 100×100 grid. Clearspace unit = 7 (outer node diameter).
  -->
  <defs>
    <style>
      .arc { stroke: #0D0D0D; stroke-width: 5; stroke-linecap: round; fill: none; }
      .node { fill: #0D0D0D; }
      .core { fill: #6B21FF; }
      .pulse { stroke: #6B21FF; stroke-width: 1.75; fill: none; opacity: 0.4; }
    </style>
  </defs>

  <!-- Beckoning arcs — paired inward scoops toward focal point -->
  <path class="arc" d="M 50 13 C 50 30, 48 40, 50 50"/>
  <path class="arc" d="M 85 34 C 72 38, 62 44, 50 50"/>
  <path class="arc" d="M 73 82 C 64 68, 58 58, 50 50"/>
  <path class="arc" d="M 27 82 C 36 68, 42 58, 50 50"/>
  <path class="arc" d="M 15 34 C 28 38, 38 44, 50 50"/>

  <!-- Outer nodes — individuals drawn toward the experience -->
  <circle class="node" cx="50" cy="13" r="7"/>
  <circle class="node" cx="85" cy="34" r="7"/>
  <circle class="node" cx="73" cy="82" r="7"/>
  <circle class="node" cx="27" cy="82" r="7"/>
  <circle class="node" cx="15" cy="34" r="7"/>

  <!-- Focal point — the shared experience -->
  <circle class="pulse" cx="50" cy="50" r="14"/>
  <circle class="core" cx="50" cy="50" r="8.5"/>
</svg>
